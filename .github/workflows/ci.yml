name: VLMB CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Release artifact audit
        run: python scripts/release_artifact_audit.py
      - name: Compile
        run: python -m py_compile music_bot_user_mixes.py config.py application/**/*.py domain/*.py providers/*.py storage/*.py services/*.py scripts/*.py
      - name: Tests
        run: python -m pytest -q
      - name: Callback audit
        run: python scripts/callback_audit.py
      - name: Architecture audit
        run: python scripts/architecture_audit.py
      - name: Release audit
        run: python scripts/release_audit.py --ci
      - name: Clean checkout manifest
        run: |
          test -f RELEASE_VERSION
          test -n "$(cat RELEASE_VERSION)"
          test ! -e .env
          test ! -d venv
      - name: Queue load baseline
        run: |
          set -euo pipefail
          mkdir -p .ci-load
          for jobs in 1 5 10 25 50 100; do
            concurrency=$(( jobs < 10 ? jobs : 10 ))
            python scripts/load_test_queue.py --jobs "$jobs" --concurrency "$concurrency" --work-ms 20 | tee ".ci-load/jobs-${jobs}.txt"
          done
      - name: Upload load baseline
        uses: actions/upload-artifact@v7
        with:
          name: vlmb-load-baseline-${{ github.sha }}
          path: .ci-load/
          retention-days: 14
      - name: Rollback drill simulation
        run: python scripts/rollback_drill.py
